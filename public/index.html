<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>AHL Officials</title>

    <!-- Belt and braces: *.expo.app already 301s to https and sends HSTS, but
         a copy served from elsewhere over http is bounced to https here. -->
    <script>
      if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
        location.replace('https:' + location.href.substring(5));
      }
    </script>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta name="description" content="Schedules, team rosters and standings for American Hockey League officials. Sign in with your AHL Officials account." />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://ahl-officials.expo.app/" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AHL Officials" />
    <meta property="og:title" content="AHL Officials" />
    <meta property="og:description" content="Schedules, team rosters and standings for American Hockey League officials." />
    <meta property="og:url" content="https://ahl-officials.expo.app/" />
    <meta property="og:image" content="https://ahl-officials.expo.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AHL Officials app icon with the tagline: schedules, rosters and standings for American Hockey League officials" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AHL Officials" />
    <meta name="twitter:description" content="Schedules, team rosters and standings for American Hockey League officials." />
    <meta name="twitter:image" content="https://ahl-officials.expo.app/og-image.png" />

    <!-- Warm up the connections the first screen needs. -->
    <link rel="preconnect" href="https://zxjzdtepjpnunjkqrsjy.supabase.co" crossorigin />
    <link rel="preconnect" href="https://challenges.cloudflare.com" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #000;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      <p style="color:#fff;font-family:system-ui,sans-serif;padding:24px">
        AHL Officials needs JavaScript to run. Please enable it and reload.
      </p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
